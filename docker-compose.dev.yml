services:
  prompt-optimizer:
    # Development mode: build from source
    build:
       context: .
       dockerfile: Dockerfile
    image: linshen/prompt-optimizer:dev
    container_name: prompt-optimizer-dev
    restart: unless-stopped
    ports:
      - "28082:${NGINX_PORT:-80}"      # Web app port (includes the MCP server, accessible via the /mcp path)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Allow the container to access the host machine
    env_file:
      - .env.local     # Read the local environment variable file
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${NGINX_PORT:-80}/ && curl -f http://localhost:${NGINX_PORT:-80}/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      # Nginx internal port configuration
      - NGINX_PORT=${NGINX_PORT:-80}

      # Web app API configuration (read from .env.local, not overridden here)

      # MCP server configuration (fixed internal Docker port 3000; the MCP_HTTP_PORT environment variable is ignored)
      # - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-debug}
      # - MCP_DEFAULT_LANGUAGE=${MCP_DEFAULT_LANGUAGE:-zh}
      # - MCP_DEFAULT_MODEL_PROVIDER=${MCP_DEFAULT_MODEL_PROVIDER:-openai}

      # Basic authentication configuration (optional)
      - ACCESS_USERNAME=${ACCESS_USERNAME:-admin}
      - ACCESS_PASSWORD=${ACCESS_PASSWORD:-123456}

