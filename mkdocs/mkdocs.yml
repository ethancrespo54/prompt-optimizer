# Site information
site_name: Prompt Optimizer Docs
site_url: https://docs.always200.com
site_description: Prompt Optimizer user documentation and deployment guide
site_author: linshenkx

# Source and output directories (decoupled from the outer project)
docs_dir: docs
site_dir: site

# Theme: Material (basic configuration; i18n/version selection to be added later)
theme:
  name: material
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png
  features:
    - content.code.copy
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo

# Plugins: search and i18n (multi-version is driven by mike, no plugin needed)
plugins:
  - search:
      lang:
        - en
  - mermaid2:
      version: 10.4.0
      arguments:
        theme: auto
        themeVariables:
          fontSize: 16px
      cache: true
  - glightbox
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          build: true
          default: true
          nav:
            - Home: index.md
            - User Guide:
                - Quick Start: user/quick-start.md
                - Basic Features:
                    - Prompt Optimization: basic/optimization.md
                    - Model Management: basic/models.md
                    - History Management: basic/history.md
                    - Template Management: basic/templates.md
                    - Data Management: basic/data.md
                - Advanced Features:
                    - Variable Management: advanced/variables.md
                    - Tool Calling: advanced/tools.md
                    - Context Management: advanced/context.md
            - Deployment:
                - Web Deployment: deployment/web.md
                - Desktop App: deployment/desktop.md
                - Chrome Extension: deployment/extension.md
                - Docker Deployment:
                    - Basic Deployment: deployment/docker-basic.md
                    - Advanced Configuration: deployment/docker-advanced.md
                    - Troubleshooting: deployment/docker-troubleshooting.md
                - MCP Server: user/mcp-server.md
            - Help & Support:
                - Common Questions: help/common-questions.md
                - Connection Issues: help/connection-issues.md
                - Troubleshooting: help/troubleshooting.md
                - Technical Support: help/support.md
            - Use Cases:
                - Creative Writing: examples/creative-writing.md
                - Business Communication: examples/business-communication.md
                - Educational Training: examples/educational-training.md
            - Developer Guide:
                - Media Examples: guide/media.md
  # Multi-version: managed by mike (no plugin needs to be enabled here)


# Material and mike integration: enable the version selector
extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/linshenkx/prompt-optimizer
      name: GitHub

# Markdown extensions
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.details
  - attr_list

# Navigation is configured inside the i18n plugin

# Repository and edit links
repo_url: https://github.com/linshenkx/prompt-optimizer
repo_name: linshenkx/prompt-optimizer
edit_uri: edit/main/mkdocs/docs/

# Strict build: treat link/reference problems as errors
strict: true

# Copyright (shown in the footer)
copyright: "© 2025 Prompt Optimizer"
