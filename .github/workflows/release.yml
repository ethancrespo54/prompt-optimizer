name: Release Desktop Apps

on:
  push:
    tags:
      - 'v*.*.*'        # Stable version: v1.0.0, v2.1.3
      - 'v*.*.*-*'      # Preview version: v1.0.0-beta.1, v1.0.0-rc.1
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. v2.0.3)'
        required: true
        type: string

env:
  NODE_VERSION: '22'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # Build the Windows version
  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Get the full git history
          fetch-tags: true  # Make sure all tags are fetched

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up the Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Configure package.json dynamically
        shell: pwsh
        run: |
          $pkgPath = "packages/desktop/package.json"
          $pkgJson = Get-Content $pkgPath -Raw | ConvertFrom-Json

          # 1. Extract the version number from the Git tag or manual input (remove the 'v' prefix)
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tagVersion = "${{ inputs.version }}".replace("v", "")
            Write-Host "📝 Using manual input version: $tagVersion"
          } else {
            $tagVersion = "${{ github.ref }}".replace("refs/tags/v", "")
            Write-Host "🏷️ Using git tag version: $tagVersion"
          }
          $pkgJson.version = $tagVersion
          Write-Host "✅ Set version to: $tagVersion"

          # 2. Set the repository address (automatically detects the current repository)
          $repoUrl = "https://github.com/${{ github.repository }}.git"
          $pkgJson.repository.url = $repoUrl
          Write-Host "✅ Set repository URL to: $repoUrl"

          # 3. Extract the owner and repo from the current repository info
          $repoInfo = "${{ github.repository }}".split("/")
          $repoOwner = $repoInfo[0]
          $repoName = $repoInfo[1]
          Write-Host "✅ Set repository owner to: $repoOwner"
          Write-Host "✅ Set repository name to: $repoName"

          # 4. Determine the version type
          $isPrerelease = $False
          $versionType = "release"

          if ($tagVersion -match "-(alpha|beta|rc)") {
            $isPrerelease = $True
            $versionType = "prerelease"
            Write-Host "🧪 Detected prerelease version"
          } elseif ($tagVersion -match "-(hotfix|patch)") {
            $isPrerelease = $False
            $versionType = "hotfix"
            Write-Host "🔧 Detected hotfix version"
          } else {
            $isPrerelease = $False
            $versionType = "release"
            Write-Host "🚀 Detected stable release version"
          }

          # 5. Set the publish config (fixed to a public repository)
          $publishConfig = @{ 
            provider = "github"
            owner = $repoOwner
            repo = $repoName
            private = $False
          }
          $pkgJson.build.publish = $publishConfig
          Write-Host "✅ Set publish config (owner: $repoOwner, repo: $repoName, private: false)"

          # 6. Write the changes back to the file
          $pkgJson | ConvertTo-Json -Depth 10 | Set-Content $pkgPath -Encoding UTF8
          Write-Host "✅ package.json updated successfully"

          # 7. Output the config summary
          Write-Host ""
          Write-Host "📋 Configuration Summary:"
          Write-Host "   Version: $tagVersion"
          Write-Host "   Type: $versionType"
          Write-Host "   Repository: $repoUrl"
          Write-Host "   Owner: $repoOwner"
          Write-Host "   Repo: $repoName"
          Write-Host "   Private: false (fixed)"
          Write-Host "   Prerelease: $isPrerelease"

      - name: Install dependencies
        run: pnpm install

      - name: Build the Desktop app
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATER }}
        run: pnpm build:desktop

      - name: Verify the build artifacts
        shell: bash
        run: |
          echo "Checking build artifacts..."
          ls -la packages/desktop/dist/ || echo "No dist directory found"
          
          # Check whether there are build artifacts
          exe_files=$(find packages/desktop/dist -name "*.exe" 2>/dev/null | wc -l)
          zip_files=$(find packages/desktop/dist -name "*.zip" 2>/dev/null | wc -l)
          
          echo "Found $exe_files .exe files and $zip_files .zip files"
          
          if [ "$exe_files" -eq 0 ] && [ "$zip_files" -eq 0 ]; then
            echo "Error: No build artifacts (.exe or .zip) found in packages/desktop/dist/"
            echo "Directory contents:"
            find packages/desktop/dist -type f 2>/dev/null || echo "Directory not found or empty"
            exit 1
          fi
          
          echo "Build artifacts verification passed"

      - name: Upload the Windows build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-build
          path: |
            packages/desktop/dist/PromptOptimizer-*.exe
            packages/desktop/dist/PromptOptimizer-*.zip
            packages/desktop/dist/latest*.yml
          retention-days: 30

  # Build the macOS version
  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Get the full git history
          fetch-tags: true  # Make sure all tags are fetched

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up the Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Configure package.json dynamically
        run: |
          PKG_PATH="packages/desktop/package.json"

          # 1. Extract the version number from the Git tag or manual input (remove the 'v' prefix)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_VERSION="${{ inputs.version }}"
            TAG_VERSION="${TAG_VERSION#v}"
            echo "📝 Using manual input version: $TAG_VERSION"
          else
            TAG_VERSION="${{ github.ref }}"
            TAG_VERSION="${TAG_VERSION#refs/tags/v}"
            echo "🏷️ Using git tag version: $TAG_VERSION"
          fi
          echo "✅ Set version to: $TAG_VERSION"
          
          # 2. Set the repository address (automatically detects the current repository)
          REPO_URL="https://github.com/${{ github.repository }}.git"
          echo "✅ Set repository URL to: $REPO_URL"
          
          # 3. Extract the owner and repo from the current repository info
          IFS='/' read -r REPO_OWNER REPO_NAME <<< "${{ github.repository }}"
          echo "✅ Set repository owner to: $REPO_OWNER"
          echo "✅ Set repository name to: $REPO_NAME"
          
          # 4. Determine the version type
          IS_PRERELEASE=false
          VERSION_TYPE="release"
          
          if [[ $TAG_VERSION =~ -(alpha|beta|rc) ]]; then
            IS_PRERELEASE=true
            VERSION_TYPE="prerelease"
            echo "🧪 Detected prerelease version"
          elif [[ $TAG_VERSION =~ -(hotfix|patch) ]]; then
            IS_PRERELEASE=false
            VERSION_TYPE="hotfix"
            echo "🔧 Detected hotfix version"
          else
            IS_PRERELEASE=false
            VERSION_TYPE="release"
            echo "🚀 Detected stable release version"
          fi
          
          # 5. Update package.json using jq
          jq --arg version "$TAG_VERSION" \
             --arg repo_url "$REPO_URL" \
             --arg repo_owner "$REPO_OWNER" \
             --arg repo_name "$REPO_NAME" \
             '.version = $version | 
              .repository.url = $repo_url | 
              .build.publish = {provider: "github", owner: $repo_owner, repo: $repo_name, private: false}' \
             "$PKG_PATH" > "${PKG_PATH}.tmp" && mv "${PKG_PATH}.tmp" "$PKG_PATH"
          
          echo "✅ package.json updated successfully"
          
          # 6. Output the config summary
          echo ""
          echo "📋 Configuration Summary:"
          echo "   Version: $TAG_VERSION"
          echo "   Type: $VERSION_TYPE"
          echo "   Repository: $REPO_URL"
          echo "   Owner: $REPO_OWNER"
          echo "   Repo: $REPO_NAME"
          echo "   Private: false (fixed)"
          echo "   Prerelease: $IS_PRERELEASE"

      - name: Install dependencies
        run: pnpm install

      - name: Build the Desktop app
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATER }}
        run: pnpm build:desktop

      - name: Verify the build artifacts
        run: |
          echo "Checking build artifacts..."
          ls -la packages/desktop/dist/ || echo "No dist directory found"
          
          # Check whether there are build artifacts
          dmg_files=$(find packages/desktop/dist -name "*.dmg" 2>/dev/null | wc -l)
          zip_files=$(find packages/desktop/dist -name "*.zip" 2>/dev/null | wc -l)
          
          echo "Found $dmg_files .dmg files and $zip_files .zip files"
          
          if [ "$dmg_files" -eq 0 ] && [ "$zip_files" -eq 0 ]; then
            echo "Error: No build artifacts (.dmg or .zip) found in packages/desktop/dist/"
            echo "Directory contents:"
            find packages/desktop/dist -type f 2>/dev/null || echo "Directory not found or empty"
            exit 1
          fi
          
          echo "Build artifacts verification passed"

      - name: Upload the macOS build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: macos-build
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.yml
          retention-days: 30

  # Build the Linux version
  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Get the full git history
          fetch-tags: true  # Make sure all tags are fetched

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up the Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Configure package.json dynamically
        run: |
          PKG_PATH="packages/desktop/package.json"

          # 1. Extract the version number from the Git tag or manual input (remove the 'v' prefix)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_VERSION="${{ inputs.version }}"
            TAG_VERSION="${TAG_VERSION#v}"
            echo "📝 Using manual input version: $TAG_VERSION"
          else
            TAG_VERSION="${{ github.ref }}"
            TAG_VERSION="${TAG_VERSION#refs/tags/v}"
            echo "🏷️ Using git tag version: $TAG_VERSION"
          fi
          echo "✅ Set version to: $TAG_VERSION"
          
          # 2. Set the repository address (automatically detects the current repository)
          REPO_URL="https://github.com/${{ github.repository }}.git"
          echo "✅ Set repository URL to: $REPO_URL"
          
          # 3. Extract the owner and repo from the current repository info
          IFS='/' read -r REPO_OWNER REPO_NAME <<< "${{ github.repository }}"
          echo "✅ Set repository owner to: $REPO_OWNER"
          echo "✅ Set repository name to: $REPO_NAME"
          
          # 4. Determine the version type
          IS_PRERELEASE=false
          VERSION_TYPE="release"
          
          if [[ $TAG_VERSION =~ -(alpha|beta|rc) ]]; then
            IS_PRERELEASE=true
            VERSION_TYPE="prerelease"
            echo "🧪 Detected prerelease version"
          elif [[ $TAG_VERSION =~ -(hotfix|patch) ]]; then
            IS_PRERELEASE=false
            VERSION_TYPE="hotfix"
            echo "🔧 Detected hotfix version"
          else
            IS_PRERELEASE=false
            VERSION_TYPE="release"
            echo "🚀 Detected stable release version"
          fi
          
          # 5. Update package.json using jq
          jq --arg version "$TAG_VERSION" \
             --arg repo_url "$REPO_URL" \
             --arg repo_owner "$REPO_OWNER" \
             --arg repo_name "$REPO_NAME" \
             '.version = $version | 
              .repository.url = $repo_url | 
              .build.publish = {provider: "github", owner: $repo_owner, repo: $repo_name, private: false}' \
             "$PKG_PATH" > "${PKG_PATH}.tmp" && mv "${PKG_PATH}.tmp" "$PKG_PATH"
          
          echo "✅ package.json updated successfully"
          
          # 6. Output the config summary
          echo ""
          echo "📋 Configuration Summary:"
          echo "   Version: $TAG_VERSION"
          echo "   Type: $VERSION_TYPE"
          echo "   Repository: $REPO_URL"
          echo "   Owner: $REPO_OWNER"
          echo "   Repo: $REPO_NAME"
          echo "   Private: false (fixed)"
          echo "   Prerelease: $IS_PRERELEASE"

      - name: Install dependencies
        run: pnpm install

      - name: Build the Desktop app
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATER }}
        run: pnpm build:desktop

      - name: Verify the build artifacts
        run: |
          echo "Checking build artifacts..."
          ls -la packages/desktop/dist/ || echo "No dist directory found"
          
          # Check whether there are build artifacts
          appimage_files=$(find packages/desktop/dist -name "*.AppImage" 2>/dev/null | wc -l)
          zip_files=$(find packages/desktop/dist -name "*.zip" 2>/dev/null | wc -l)
          
          echo "Found $appimage_files .AppImage files and $zip_files .zip files"
          
          if [ "$appimage_files" -eq 0 ] && [ "$zip_files" -eq 0 ]; then
            echo "Error: No build artifacts (.AppImage or .zip) found in packages/desktop/dist/"
            echo "Directory contents:"
            find packages/desktop/dist -type f 2>/dev/null || echo "Directory not found or empty"
            exit 1
          fi
          
          echo "Build artifacts verification passed"

      - name: Upload the Linux build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-build
          path: |
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.yml
          retention-days: 30

  # Create the GitHub Release
  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Get the full git history
          fetch-tags: true  # Make sure all tags are fetched

      - name: Get the version number and type
        id: version
        run: |
          # Get the version number from the Git tag or manual input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            echo "📝 Using manual input version: $VERSION"
          else
            VERSION=${GITHUB_REF#refs/tags/}
            echo "🏷️ Using git tag version: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

          # Detailed version type determination
          IS_PRERELEASE=false
          VERSION_TYPE="release"
          RELEASE_NAME_PREFIX=""

          if [[ $VERSION =~ -(alpha|beta|rc) ]]; then
            IS_PRERELEASE=true
            VERSION_TYPE="prerelease"
            RELEASE_NAME_PREFIX="Preview "
            echo "🧪 Detected prerelease version"
          elif [[ $VERSION =~ -(hotfix|patch) ]]; then
            IS_PRERELEASE=false
            VERSION_TYPE="hotfix"
            RELEASE_NAME_PREFIX="Hotfix "
            echo "🔧 Detected hotfix version"
          else
            IS_PRERELEASE=false
            VERSION_TYPE="release"
            RELEASE_NAME_PREFIX="Release "
            echo "🚀 Detected stable release version"
          fi

          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "version_type=$VERSION_TYPE" >> $GITHUB_OUTPUT
          echo "release_name_prefix=$RELEASE_NAME_PREFIX" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./artifacts

      - name: Show the build artifacts
        run: |
          echo "Build artifact list:"
          find ./artifacts -type f -name "*" | sort

      - name: Remove debug files
        run: |
          echo "Removing debug files..."
          find ./artifacts -type f -name "builder-debug.yml" -delete
          echo "Final artifact list after cleaning:"
          find ./artifacts -type f | sort

      - name: Generate Release Notes
        id: release_notes
        run: |
          # Get the current tag
          CURRENT_TAG=${{ steps.version.outputs.version }}
          echo "Current tag: $CURRENT_TAG"

          # Get all tags and output debug info
          echo "All tags (sorted):"
          git tag --sort=-version:refname | head -10

          # Improved logic for getting the previous tag
          # 1. First try to get all stable version tags (excluding preview versions)
          STABLE_TAGS=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          echo "Stable tags found: $STABLE_TAGS"

          # 2. Get all tags (including preview versions)
          ALL_TAGS=$(git tag --sort=-version:refname)

          # 3. Choose a suitable comparison strategy based on the current tag type
          PREVIOUS_TAG=""
          if [[ $CURRENT_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # The current one is a stable version; find the previous stable version
            PREVIOUS_TAG=$(echo "$STABLE_TAGS" | grep -v "^$CURRENT_TAG$" | head -1 || true)
            echo "Current is stable release, previous stable tag: $PREVIOUS_TAG"
          else
            # The current one is a preview version; find the previous version of any kind
            PREVIOUS_TAG=$(echo "$ALL_TAGS" | grep -v "^$CURRENT_TAG$" | head -1 || true)
            echo "Current is prerelease, previous tag: $PREVIOUS_TAG"
          fi

          # Generate the commit history (handling multiple lines and long commits)
          COMMITS=""
          if [ -n "$PREVIOUS_TAG" ] && git rev-parse "$PREVIOUS_TAG" >/dev/null 2>&1 && git rev-parse "$CURRENT_TAG" >/dev/null 2>&1; then
            echo "Generating commits from $PREVIOUS_TAG to $CURRENT_TAG"
            COMMITS=$(git log --pretty=format:"%s|%h" $PREVIOUS_TAG..$CURRENT_TAG | while IFS='|' read -r subject hash; do
              # Truncate overly long commit messages (keep the first 80 characters)
              if [ ${#subject} -gt 80 ]; then
                subject="${subject:0:77}..."
              fi
              echo "- $subject ([${hash}](https://github.com/${{ github.repository }}/commit/${hash}))"
            done)
          elif git rev-parse "$CURRENT_TAG" >/dev/null 2>&1; then
            echo "No previous tag found or invalid, showing commits for current tag"
            COMMITS=$(git log --pretty=format:"%s|%h" --max-count=10 | while IFS='|' read -r subject hash; do
              # Truncate overly long commit messages (keep the first 80 characters)
              if [ ${#subject} -gt 80 ]; then
                subject="${subject:0:77}..."
              fi
              echo "- $subject ([${hash}](https://github.com/${{ github.repository }}/commit/${hash}))"
            done)
          fi

          # Check whether there are commits
          if [ -z "$COMMITS" ]; then
            echo "No commits found, using fallback message"
            COMMITS="- Initial release"
          else
            echo "Generated commits:"
            echo "$COMMITS"
          fi

          # Limit the number of commits (show at most 20)
          COMMITS_LIMITED=$(echo "$COMMITS" | head -20)
          COMMITS_COUNT=$(echo "$COMMITS" | wc -l)

          if [ $COMMITS_COUNT -gt 20 ]; then
            COMMITS_LIMITED="$COMMITS_LIMITED

          ... and $((COMMITS_COUNT - 20)) more commits"
          fi

          # Get the contributors of this release (excluding the main author)
          CONTRIBUTORS=""
          if [ -n "$PREVIOUS_TAG" ] && git rev-parse "$PREVIOUS_TAG" >/dev/null 2>&1; then
            # Get the contributor list, excluding the main author and bots
            CONTRIBUTORS=$(git log --pretty=format:"%an|%ae" $PREVIOUS_TAG..$CURRENT_TAG 2>/dev/null | \
              sort -u | \
              grep -v -E "^(linshen|linshenkx|且炼时光)\|" | \
              grep -v -E "\[bot\]@" | \
              grep -v -E "^GitButler\|" | \
              cut -d'|' -f1 | \
              sort -u || true)
          else
            CONTRIBUTORS=$(git log --pretty=format:"%an|%ae" --max-count=50 2>/dev/null | \
              sort -u | \
              grep -v -E "^(linshen|linshenkx|且炼时光)\|" | \
              grep -v -E "\[bot\]@" | \
              grep -v -E "^GitButler\|" | \
              cut -d'|' -f1 | \
              sort -u || true)
          fi

          # Format the contributor list
          CONTRIBUTORS_SECTION=""
          if [ -n "$CONTRIBUTORS" ]; then
            CONTRIBUTORS_LIST=$(echo "$CONTRIBUTORS" | while read -r name; do
              [ -n "$name" ] && echo "- @$name"
            done | grep -v "^$" || true)

            if [ -n "$CONTRIBUTORS_LIST" ]; then
              CONTRIBUTORS_SECTION="
          ### 🙏 Acknowledgements

          Thanks to the following contributors for their contributions to this release:

          $CONTRIBUTORS_LIST
          "
              echo "Found contributors: $CONTRIBUTORS"
            fi
          fi

          # Set a different icon and description depending on the version type
          VERSION_ICON="🚀"
          VERSION_DESC="Stable release"
          STABILITY_NOTE=""

          if [[ $CURRENT_TAG =~ -(alpha|beta|rc) ]]; then
            VERSION_ICON="🧪"
            VERSION_DESC="Preview release"
            STABILITY_NOTE="

          > ⚠️ **Note**: This is a preview release and may contain experimental features. It is recommended for non-production environments."
          elif [[ $CURRENT_TAG =~ -(hotfix|patch) ]]; then
            VERSION_ICON="🔧"
            VERSION_DESC="Hotfix release"
            STABILITY_NOTE="

          > 🔧 **Hotfix release**: This release mainly contains fixes for important issues, and updating as soon as possible is recommended."
          fi

          # Create the release notes
          cat > release_notes.md << EOF
          ## $VERSION_ICON Prompt Optimizer $CURRENT_TAG

          **Release type**: $VERSION_DESC$STABILITY_NOTE

          ### 📦 Download
          - **Windows**: \`PromptOptimizer-*-win-x64.exe\` (installer) or \`PromptOptimizer-*-win-x64.zip\` (portable)
          - **macOS (Apple Silicon)**: \`PromptOptimizer-*-darwin-arm64.dmg\` (installer) or \`PromptOptimizer-*-darwin-arm64.zip\` (portable)
          - **macOS (Intel)**: \`PromptOptimizer-*-darwin-x64.dmg\` (installer) or \`PromptOptimizer-*-darwin-x64.zip\` (portable)
          - **Linux**: \`PromptOptimizer-*-linux-x86_64.AppImage\` (portable) or \`PromptOptimizer-*-linux-x64.zip\` (portable)

          ### 🔧 Installation notes
          - **Windows**:
            - **Installer**: download the \`.exe\` file and double-click it to run the setup wizard
            - **Portable**: download the \`.zip\` file, extract it, and run \`PromptOptimizer.exe\`
          - **macOS**:
            - **Apple Silicon (M1/M2/M3)**: download the \`darwin-arm64\` version
            - **Intel chip**: download the \`darwin-x64\` version
            - **Installer**: download the \`.dmg\` file, double-click to mount it, and drag it to the Applications folder
            - **Portable**: download the \`.zip\` file, extract it, and run \`PromptOptimizer.app\`
            - ⚠️ **Security note**: if opening the app shows "is damaged" or "cannot verify the developer", run the following command in the terminal and try again:
              \`\`\`bash
              xattr -rd com.apple.quarantine /Applications/PromptOptimizer.app
              \`\`\`
              Or for .dmg files:
              \`\`\`bash
              xattr -rd com.apple.quarantine ~/Downloads/PromptOptimizer-*.dmg
              \`\`\`
          - **Linux**:
            - **AppImage**: download the \`.AppImage\` file, add execute permission, and run it directly
            - **Portable**: download the \`.zip\` file, extract it, and run \`PromptOptimizer\`

          ### 📝 What's changed
          $COMMITS_LIMITED
          $CONTRIBUTORS_SECTION
          ### 🔗 More information
          - **Project home**: [GitHub Repository](https://github.com/${{ github.repository }})
          - **Feedback**: [Issues](https://github.com/${{ github.repository }}/issues)
          - **Discussions**: [Discussions](https://github.com/${{ github.repository }}/discussions)

          ---
          **Tip**: to see the full commit history, visit the project's [GitHub Commits](https://github.com/${{ github.repository }}/commits)
          EOF

          echo "Generated release notes:"
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.release_name_prefix }}${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: |
            ./artifacts/windows-build/*
            ./artifacts/macos-build/*
            ./artifacts/linux-build/*
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
